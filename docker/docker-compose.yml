# Runs every Kelsey backend at once: MySQL (kelseydb), auth-service-backend,
# points-system-backend and ai-chatbot-backend. The frontend is not in here:
# run it on the host with `npm run dev` (see env.example in the repo root).
#
#   cp docker/env.example docker/.env      # then fill in the values
#   npm run backends:up                    # docker compose -f docker/docker-compose.yml up -d --build
#
# The backend repositories are expected next to main-frontend:
#   kelsey/main-frontend, kelsey/auth-service-backend,
#   kelsey/points-system-backend, kelsey/ai-chatbot-backend
# Override AUTH_SERVICE_DIR / POINTS_SYSTEM_DIR / AI_CHATBOT_DIR in docker/.env otherwise.

name: kelsey

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: kelseydb
      MYSQL_USER: ${DB_USER:-kelsey}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      TZ: Asia/Manila
    ports:
      # 3307 on the host so it does not clash with a local MySQL on 3306.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Only runs on the first start (empty volume): auth schema first, then the rewards tables.
      - ${AUTH_SERVICE_DIR:-../../auth-service-backend}/schema.sql:/docker-entrypoint-initdb.d/01_auth_schema.sql:ro
      - ${POINTS_SYSTEM_DIR:-../../points-system-backend}/schema.sql:/docker-entrypoint-initdb.d/02_rewards_schema.sql:ro
    healthcheck:
      # TCP (127.0.0.1) is closed while the init scripts run, so this only passes once the schema is loaded.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  auth-service:
    build: ${AUTH_SERVICE_DIR:-../../auth-service-backend}
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env}
      PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:3001}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-kelsey}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: kelseydb
      TZ: Asia/Manila
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  points-system:
    build: ${POINTS_SYSTEM_DIR:-../../points-system-backend}
    environment:
      PORT: 3002
      PUBLIC_URL: ${REWARDS_PUBLIC_URL:-http://localhost:3002}
      AUTH_SERVICE_URL: http://auth-service:3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-kelsey}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: kelseydb
      TZ: Asia/Manila
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  ai-chatbot:
    build: ${AI_CHATBOT_DIR:-../../ai-chatbot-backend}
    environment:
      PORT: 3003
      PUBLIC_URL: ${CHATBOT_PUBLIC_URL:-http://localhost:3003}
      AUTH_SERVICE_URL: http://auth-service:3001
      # Optional: without it the backend runs but /api/chat answers 503.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TZ: Asia/Manila
    ports:
      - "3003:3003"
    depends_on:
      auth-service:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
